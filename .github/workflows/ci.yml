name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The Prisma client is generated code; typecheck, build and tests need it.
      - run: npm run prisma:generate --workspace=@formforge/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
