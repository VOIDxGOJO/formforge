services:
  postgres:
    image: postgres:16-alpine
    container_name: formforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formforge
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d formforge']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: formforge-api
    env_file:
      - apps/api/.env
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev --workspace=@formforge/api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: formforge-web
    env_file:
      - apps/web/.env.local
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib
    depends_on:
      - api
    command: npm run dev --workspace=@formforge/web

volumes:
  pgdata:
